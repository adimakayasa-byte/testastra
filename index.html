<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop &amp; Drive — Pesan Aki Mobil</title>

  <!-- PWA / dukungan mobile app -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ee3124" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="S&amp;D Aki" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />

  <!-- Open Graph: preview saat link dibagikan di WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shop & Drive — Pesan Aki Mobil" />
  <meta property="og:description" content="Pilih aki mobil, atur jumlah, lalu checkout via WhatsApp. Tanpa bayar di web." />
  <meta property="og:image" content="https://placehold.co/1200x630/e30613/ffffff?text=Shop+%26+Drive+-+Aki" />

  <style>
    :root {
      --sad-red: #e30613;
      --sad-red-dark: #b8050f;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #e5e7eb;
      --wa: #25d366;
      --wa-dark: #1da851;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5; padding-bottom: 140px;
    }
    header {
      background: linear-gradient(135deg, var(--sad-red), var(--sad-red-dark));
      color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; text-align: center;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .logo-chip {
      background: #fff; border-radius: 10px; padding: 8px 12px; width: 168px;
      box-shadow: 0 3px 10px rgba(0,0,0,.18); display: block; line-height: 0;
    }
    .logo-chip svg { width: 100%; height: auto; display: block; }
    .install-btn {
      display: none; align-items: center; gap: 6px; background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.45); color: #fff; font-weight: 700; font-size: 13px;
      padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .install-btn:active { background: rgba(255,255,255,.3); }
    header h1 { font-size: 22px; margin-top: 4px; font-weight: 800; }
    header p { font-size: 13px; opacity: .92; margin-top: 6px; }

    .wrap { max-width: 960px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--muted); padding: 18px 16px 6px; }

    .carousel-shell { position: relative; }
    .carousel {
      display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 4px 16px 18px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .carousel::-webkit-scrollbar { height: 6px; }
    .carousel::-webkit-scrollbar-thumb { background: #cbd0d6; border-radius: 999px; }

    .card {
      scroll-snap-align: start; flex: 0 0 78%; max-width: 260px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }
    .card.selected { border-color: var(--sad-red); box-shadow: 0 4px 16px rgba(227,6,19,.18); }
    .card .img-box {
      background: #fff; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--border); position: relative;
    }
    .card .img-box img { width: 100%; height: 100%; object-fit: contain; }
    .qty-badge {
      position: absolute; top: 8px; right: 8px; background: var(--sad-red); color: #fff;
      min-width: 24px; height: 24px; border-radius: 999px; font-size: 13px; font-weight: 700;
      display: none; align-items: center; justify-content: center; padding: 0 7px;
    }
    .card.selected .qty-badge { display: flex; }
    .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; }
    .card .brand-tag { font-size: 11px; font-weight: 700; color: var(--sad-red); text-transform: uppercase; letter-spacing: .5px; }
    .card h3 { font-size: 15px; font-weight: 700; margin: 3px 0; }
    .card .specs { font-size: 12px; color: var(--muted); flex: 1; }
    .card .price { font-size: 18px; font-weight: 800; margin: 10px 0 12px; }

    .add-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--sad-red); color: #fff; border: none; cursor: pointer;
      font-weight: 700; font-size: 14px; padding: 11px; border-radius: 10px; width: 100%;
    }
    .add-btn:active { background: var(--sad-red-dark); }
    .stepper {
      display: none; align-items: center; justify-content: space-between;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .card.selected .add-btn { display: none; }
    .card.selected .stepper { display: flex; }
    .stepper button {
      width: 42px; height: 42px; border: none; background: #fff; color: var(--sad-red);
      font-size: 22px; font-weight: 700; cursor: pointer;
    }
    .stepper button:active { background: #fdeaea; }
    .stepper .q { font-size: 16px; font-weight: 700; min-width: 28px; text-align: center; }

    .navbtn {
      position: absolute; top: 40%; transform: translateY(-50%); width: 40px; height: 40px;
      border-radius: 50%; background: #fff; border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: var(--ink); z-index: 3;
    }
    .navbtn.prev { left: 4px; } .navbtn.next { right: 4px; }
    @media (min-width: 700px) { .navbtn { display: flex; } .card { flex-basis: 240px; } }

    /* ===== Bar checkout (sticky bawah) ===== */
    .checkout-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: #fff; border-top: 1px solid var(--border);
      box-shadow: 0 -4px 20px rgba(0,0,0,.08);
      transform: translateY(120%); transition: transform .25s ease;
    }
    .checkout-bar.show { transform: translateY(0); }
    .cb-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .cb-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cb-summary .items { font-size: 13px; color: var(--muted); }
    .cb-summary .total { font-size: 20px; font-weight: 800; }
    .cb-name {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; margin-bottom: 10px; font-family: inherit;
    }
    .checkout-btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: var(--wa); color: #fff; text-decoration: none; border: none; cursor: pointer;
      font-weight: 800; font-size: 16px; padding: 14px; border-radius: 12px; width: 100%;
    }
    .checkout-btn:active { background: var(--wa-dark); }
    .checkout-btn svg { width: 20px; height: 20px; fill: #fff; }
    .cb-clear { display:block; text-align:center; background:none; border:none; color:var(--muted); font-size:12px; margin-top:8px; cursor:pointer; width:100%; }

    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; padding: 0 16px; }
    footer a { color: var(--sad-red); }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <span class="logo-chip">
        <svg viewBox="0 0 1024 653" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shop & Drive">
          <rect width="1024" height="653" fill="#ee3124"/>
          <rect y="430" width="1024" height="76" fill="#3b34a0"/>
          <g fill="#3b34a0">
            <rect x="828" y="150" width="150" height="20" transform="skewX(-18)"/>
            <rect x="828" y="185" width="150" height="20" transform="skewX(-18)"/>
            <rect x="828" y="220" width="150" height="20" transform="skewX(-18)"/>
            <rect x="828" y="255" width="150" height="20" transform="skewX(-18)"/>
          </g>
          <g fill="#ffffff" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic" letter-spacing="-6">
            <text x="86" y="245" font-size="205">SHOP</text>
            <text x="140" y="415" font-size="205">&amp;DRIVE</text>
          </g>
        </svg>
      </span>
      <button id="installBtn" class="install-btn" onclick="installApp()">📲 Pasang aplikasi</button>
    </div>
    <h1>Pesan Aki Mobil</h1>
    <p>Pilih aki, atur jumlah, lalu <b>Checkout via WhatsApp</b> 🛒</p>
  </header>

  <div class="wrap">
    <div class="section-title">Katalog Aki</div>
    <div class="carousel-shell">
      <button class="navbtn prev" aria-label="Sebelumnya" onclick="nudge(-1)">‹</button>
      <div class="carousel" id="carousel"></div>
      <button class="navbtn next" aria-label="Berikutnya" onclick="nudge(1)">›</button>
    </div>
    <footer>
      Sumber produk:
      <a href="https://www.shopanddrive.com/produk?category=Aki" target="_blank" rel="noopener">shopanddrive.com — Aki</a>
    </footer>
  </div>

  <!-- Bar checkout -->
  <div class="checkout-bar" id="checkoutBar">
    <div class="cb-inner">
      <div class="cb-summary">
        <span class="items" id="cbItems">0 barang</span>
        <span class="total" id="cbTotal">Rp 0</span>
      </div>
      <input class="cb-name" id="cbName" type="text" placeholder="Nama kamu (opsional)" />
      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">
        <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-2.1c1.8 1 3.9 1.5 6 1.5 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.5c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.4 1.2 1.2-4.3-.3-.4a10 10 0 01-1.6-5.4C5.2 9.6 10 5 16 5s10.8 4.6 10.8 10.5S22 25.5 16 25.5zm5.9-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2s-.8 1-.9 1.2c-.2.2-.3.2-.6.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5 0-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.4 5.3 4.7 2 .8 2.7.9 3.7.8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z"/></svg>
        Checkout via WhatsApp
      </button>
      <button class="cb-clear" onclick="clearCart()">Kosongkan keranjang</button>
    </div>
  </div>

  <script>
    /* =========================================================
       KONFIGURASI — ubah baris di bawah ini
       ========================================================= */
    const WA_NUMBER = "62895340200179";   // nomor WhatsApp toko (format 62..., tanpa + / spasi)
    const STORE_NAME = "Shop & Drive";
    /* ========================================================= */

    const FALLBACK = { products: [
      { name: "Aki GS Astra Hybrid NS70",  brand: "GS Astra", category: "Hybrid", price: "Rp 1.263.000", sku: "NS70",  image: "", specs: "Hybrid · Low Maintenance" },
      { name: "Aki GS Astra Hybrid NS60S", brand: "GS Astra", category: "Hybrid", price: "Rp 936.000",   sku: "NS60S", image: "", specs: "Hybrid · Low Maintenance" },
      { name: "Aki GS Astra Hybrid N70Z",  brand: "GS Astra", category: "Hybrid", price: "Rp 1.527.000", sku: "N70Z",  image: "", specs: "Hybrid · Low Maintenance" },
      { name: "Aki GS Astra MF OE 355LN2", brand: "GS Astra", category: "Maintenance Free", price: "Rp 2.109.000", sku: "355LN2", image: "", specs: "Maintenance Free · P 242 × L 175 × T 190 mm" },
      { name: "Aki GS Astra MF ISS S95",   brand: "GS Astra", category: "Maintenance Free", price: "Rp 6.211.000", sku: "S95",    image: "", specs: "Maintenance Free · Idle Start Stop · P 260 × L 173 × T 204 mm" },
      { name: "Aki GS Astra MF ISS Q85",   brand: "GS Astra", category: "Maintenance Free", price: "Rp 4.170.000", sku: "Q85",    image: "", specs: "Maintenance Free · Idle Start Stop · P 230 × L 171 × T 200 mm" },
      { name: "Aki GS Astra ISS M-42R",    brand: "GS Astra", category: "Maintenance Free", price: "Rp 2.604.000", sku: "M-42R",  image: "", specs: "Maintenance Free · Idle Start Stop" },
      { name: "Aki GS Astra Calcium 75D23L", brand: "GS Astra", category: "Calcium", price: "Rp 1.799.000", sku: "75D23L", image: "", specs: "Calcium Battery" },
      { name: "Aki GS Astra Calcium 65B24LS", brand: "GS Astra", category: "Calcium", price: "Rp 1.548.000", sku: "65B24LS", image: "", specs: "Calcium Battery" }
    ]};

    const carousel = document.getElementById("carousel");
    let PRODUCTS = [];
    const cart = {};   // { index: qty }

    function priceToNumber(str) {
      if (typeof str === "number") return str;
      const n = parseInt(String(str || "").replace(/[^\d]/g, ""), 10);
      return isNaN(n) ? 0 : n;
    }
    function rupiah(n) { return "Rp " + n.toLocaleString("id-ID"); }

    // Placeholder GS ber-brand bila foto asli belum ada (warna ikut kategori)
    function placeholderSVG(p) {
      const cat = (p.category || "").toLowerCase();
      let c1 = "#00843d", c2 = "#0a5a2c";            // Hybrid: hijau
      if (cat.indexOf("calcium") >= 0) { c1 = "#f4b400"; c2 = "#c98a00"; }   // Calcium: emas
      else if (cat.indexOf("maintenance") >= 0 || cat.indexOf("iss") >= 0) { c1 = "#2b2f36"; c2 = "#12151a"; } // MF: gelap
      const sku = (p.sku || "").replace(/&/g, "&amp;");
      return '<svg viewBox="0 0 300 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><linearGradient id="g' + sku + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>' +
        '<rect width="300" height="300" fill="#fff"/>' +
        '<rect x="70" y="70" width="160" height="160" rx="14" fill="url(#g' + sku + ')"/>' +
        '<text x="150" y="165" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#fff" text-anchor="middle">GS</text>' +
        '<text x="150" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.9">' + sku + '</text>' +
        '</svg>';
    }

    function render(products) {
      PRODUCTS = products || [];
      if (!PRODUCTS.length) { carousel.innerHTML = '<p style="padding:24px;color:#6b7280">Belum ada produk.</p>'; return; }
      carousel.innerHTML = PRODUCTS.map(function (p, i) {
        return (
          '<div class="card" id="card-' + i + '">' +
            '<div class="img-box">' +
              (p.image ? '<img loading="lazy" src="' + p.image + '" alt="' + (p.name || "") + '">' : placeholderSVG(p)) +
              '<span class="qty-badge" id="badge-' + i + '">0</span>' +
            '</div>' +
            '<div class="body">' +
              (p.brand ? '<span class="brand-tag">' + p.brand + '</span>' : '') +
              '<h3>' + (p.name || "") + '</h3>' +
              '<div class="specs">' + (p.specs || "") + '</div>' +
              '<div class="price">' + (p.price || rupiah(priceToNumber(p.price))) + '</div>' +
              '<button class="add-btn" onclick="setQty(' + i + ',1)">+ Tambah ke pesanan</button>' +
              '<div class="stepper">' +
                '<button onclick="changeQty(' + i + ',-1)">−</button>' +
                '<span class="q" id="q-' + i + '">0</span>' +
                '<button onclick="changeQty(' + i + ',1)">+</button>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    function setQty(i, q) { cart[i] = q; syncCard(i); updateBar(); }
    function changeQty(i, d) {
      const next = (cart[i] || 0) + d;
      if (next <= 0) { delete cart[i]; } else { cart[i] = next; }
      syncCard(i); updateBar();
    }
    function syncCard(i) {
      const card = document.getElementById("card-" + i);
      const q = cart[i] || 0;
      card.classList.toggle("selected", q > 0);
      document.getElementById("q-" + i).textContent = q;
      document.getElementById("badge-" + i).textContent = q;
    }

    function cartLines() {
      return Object.keys(cart).map(function (i) {
        const p = PRODUCTS[i], q = cart[i], unit = priceToNumber(p.price);
        return { p: p, q: q, unit: unit, sub: unit * q };
      });
    }
    function updateBar() {
      const lines = cartLines();
      const count = lines.reduce(function (s, l) { return s + l.q; }, 0);
      const total = lines.reduce(function (s, l) { return s + l.sub; }, 0);
      document.getElementById("cbItems").textContent = count + " barang";
      document.getElementById("cbTotal").textContent = rupiah(total);
      document.getElementById("checkoutBar").classList.toggle("show", count > 0);
    }
    function clearCart() {
      Object.keys(cart).forEach(function (i) { delete cart[i]; syncCard(i); });
      updateBar();
    }

    function checkout() {
      const lines = cartLines();
      if (!lines.length) return;
      const name = document.getElementById("cbName").value.trim();
      let total = 0;
      let msg = "Halo " + STORE_NAME + " 👋\n\nSaya mau pesan:\n";
      lines.forEach(function (l, idx) {
        total += l.sub;
        msg += (idx + 1) + ". " + l.p.name + (l.p.sku ? " (" + l.p.sku + ")" : "") +
               "\n   " + l.q + " x " + rupiah(l.unit) + " = " + rupiah(l.sub) + "\n";
      });
      msg += "\nTotal: " + rupiah(total) + "\n";
      if (name) msg += "\nNama: " + name;
      msg += "\n\nMohon konfirmasi ketersediaan stok. Terima kasih 🙏";
      window.open("https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
    }

    function nudge(dir) {
      const card = carousel.querySelector(".card");
      const step = card ? card.offsetWidth + 14 : 260;
      carousel.scrollBy({ left: dir * step, behavior: "smooth" });
    }

    fetch("products.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("no json"); return r.json(); })
      .then(function (data) { render(data.products); })
      .catch(function () { render(FALLBACK.products); });

    /* ===== Dukungan mobile app (PWA) ===== */
    // Service worker (aktif hanya saat di-host via http/https, diabaikan di file://)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
    // Tombol "Pasang aplikasi" (Android/Chrome). iOS: pakai Share > Add to Home Screen.
    var deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("installBtn").style.display = "inline-flex";
    });
    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        document.getElementById("installBtn").style.display = "none";
      });
    }
    window.addEventListener("appinstalled", function () {
      document.getElementById("installBtn").style.display = "none";
    });
  </script>
</body>
</html>
